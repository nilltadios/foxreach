# Builds the foxreach manager (manager/) as an AppImage and a Flatpak bundle, each for x86_64 and
# aarch64, on native runners (no emulation), checks each one without a display, and keeps the four
# files, their .sha256 and each AppImage's .zsync (what AppImage updaters download) as this run's
# artifacts (manager-appimage-ARCH, manager-flatpak-ARCH). The packages carry no foxreach program:
# the app downloads the release when asked, so nothing outside manager/ is built here.
# manager-release.yml calls it on a manager-v<version> tag and publishes the files in a release.
# The packages are built only when the manager's unit tests pass (the `test` job), so a failing
# test publishes nothing.
#
# The aarch64 jobs also fail if any shipped ELF file has a LOAD segment aligned below 16 KiB:
# such a file does not load on a 16 KiB-page kernel (Asahi Linux on Apple Silicon). GitHub's arm
# runners are expected to use 4 KiB pages (the jobs print it), so these jobs do not run the packages
# with 16 KiB pages themselves.
name: manager

on:
  workflow_dispatch:
  workflow_call:
  push:
    # Branches only: a manager-v tag push builds these through manager-release.yml.
    branches: ["**"]
    paths:
      - manager/**
      - .github/workflows/manager.yml
      # Read by the manager's tests (src/icons.rs): an agent or browser added there without a logo
      # fails the test job.
      - bridge/agents.mjs
      - bridge/addon.mjs
      - bridge/browsers.mjs
  pull_request:
    paths:
      - manager/**
      - .github/workflows/manager.yml
      # Read by the manager's tests (src/icons.rs): an agent or browser added there without a logo
      # fails the test job.
      - bridge/agents.mjs
      - bridge/addon.mjs
      - bridge/browsers.mjs

permissions:
  contents: read

jobs:
  # The manager's unit tests, among them the ones that fail when an agent, linked app or browser
  # foxreach knows has no bundled icon. They read bridge/*.mjs, so they need the whole checkout.
  # libxkbcommon is the only system library the build links (wayland-sys is built with dlopen);
  # pkg-config is how smithay-client-toolkit finds it.
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev
      - name: cargo test
        working-directory: manager
        run: |
          rustup toolchain install   # the one in rust-toolchain.toml
          cargo test --locked

  # The vendored crates the offline Flatpak build uses, the same for both architectures.
  prepare:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Vendor the crates (pinned by Cargo.lock)
        working-directory: manager
        run: |
          rustup toolchain install   # the one in rust-toolchain.toml
          cargo vendor --locked flatpak/vendor | sed "s|$PWD/flatpak/vendor|flatpak/vendor|" > flatpak/cargo-config.toml
          tar -cf ../vendor.tar flatpak/vendor flatpak/cargo-config.toml
      - uses: actions/upload-artifact@v4
        with:
          name: manager-inputs
          path: vendor.tar
          retention-days: 1

  appimage:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-26.04 }
          - { arch: aarch64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build in the Ubuntu 26.04 container
        run: ENGINE=docker BUILD_JOBS=4 manager/packaging/container-build.sh
      - name: Smoke check (extract, AppRun --version, no foxreach program packed)
        run: manager/packaging/smoke-appimage.sh manager/dist/foxreach-manager-*-${{ matrix.arch }}.AppImage "$RUNNER_TEMP/smoke"
      - name: Every shipped ELF file loads with 16 KiB pages
        if: matrix.arch == 'aarch64'
        run: |
          echo "This runner's page size: $(getconf PAGESIZE)"
          manager/packaging/check-elf-alignment.sh manager/dist/foxreach-manager-*-aarch64.AppImage "$RUNNER_TEMP/smoke/AppDir"
      - name: Update information embedded, and the .zsync matches the final AppImage
        run: manager/packaging/check-update-info.sh manager/dist/foxreach-manager-*-${{ matrix.arch }}.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: manager-appimage-${{ matrix.arch }}
          path: |
            manager/dist/foxreach-manager-*-${{ matrix.arch }}.AppImage
            manager/dist/foxreach-manager-*-${{ matrix.arch }}.AppImage.sha256
            manager/dist/foxreach-manager-*-${{ matrix.arch }}.AppImage.zsync
          if-no-files-found: error

  flatpak:
    needs: [test, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-26.04 }
          - { arch: aarch64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    # flatpak-builder, org.freedesktop.Sdk//26.08 and the Platform, for amd64 and arm64.
    # --privileged: flatpak-builder and flatpak run need namespaces for bubblewrap.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: manager-inputs
          path: inputs
      - name: The vendored crates
        run: tar -xf inputs/vendor.tar -C manager
      - name: Build
        # No cargo here (crates vendored above) and no user systemd (the job is the limit).
        run: VENDOR=0 BUILD_SCOPE=0 BUILD_JOBS=4 manager/flatpak/build.sh
      - name: Every shipped ELF file loads with 16 KiB pages
        if: matrix.arch == 'aarch64'
        run: |
          echo "This runner's page size: $(getconf PAGESIZE)"
          manager/packaging/check-elf-alignment.sh manager/flatpak/build-dir/files
      - name: Smoke check (install --user, --version in the sandbox, no foxreach program packed)
        run: manager/flatpak/smoke.sh manager/flatpak/foxreach-manager-*-${{ matrix.arch }}.flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: manager-flatpak-${{ matrix.arch }}
          path: |
            manager/flatpak/foxreach-manager-*-${{ matrix.arch }}.flatpak
            manager/flatpak/foxreach-manager-*-${{ matrix.arch }}.flatpak.sha256
          if-no-files-found: error
