# Publishes https://nilltadios.github.io/foxreach/: docs/ unchanged (updates.json,
# updates-signed.json and the .xpi files installed add-ons poll, the start page index.html and
# 404.html) plus the manager's signed Flatpak repository, .flatpakref and .flatpakrepo, laid out by
# manager/flatpak/build-site.sh. The one file that differs from docs/ is index.html in a site with
# the repository: build-site.sh switches on its Flatpak part, which is a comment in docs/.
#
# The site root answered 404 from the start, as docs/ had no index.html (issue #15). Before upload,
# manager/flatpak/check-site-pages.sh checks that both pages are there and that everything they
# link to is in the site; after the deployment, the deploy job fetches the site's root and a
# missing address and fails the run unless they answer with these two pages.
#
# Stateless: the Flatpak content is the x86_64 and aarch64 bundles of the release marked latest
# (every release carries them: release.yml, manager-release.yml), else of the newest release that
# has both, checked against their .sha256 and build attestation before import. Unchanged bundles give
# the same commits, so a redeploy is no update for clients.
#
# Does nothing but check docs/ (check-site-pages.sh --docs-only) until Pages is set to deploy from
# GitHub Actions: while Pages builds from main /docs ("legacy"), that keeps serving docs/ as before,
# and this workflow cannot see what it serves.
#
# If the Flatpak part fails (no GPG_PRIVATE_KEY secret, a key other than
# manager/flatpak/signing-key.asc, no release with bundles, a checksum or attestation mismatch),
# docs/ is deployed alone, so the add-on update lists still go out, and the run fails afterwards (a
# start page or 404 page that fails check-site-pages.sh stops every deployment, this one too).
# That deployment has no Flatpak repository: installed copies report an error on update until the
# next good run.
#
# The github-pages environment deploys from main only, so release.yml and manager-release.yml start
# this workflow on main (workflow_dispatch) after publishing a release, rather than calling it from
# the tag.
name: pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/**
      - manager/flatpak/build-site.sh
      - manager/flatpak/check-site-pages.sh
      - manager/flatpak/signing-key.asc
      - .github/workflows/pages.yml

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.mode.outputs.enabled }}
    steps:
      - id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)
          if [[ $mode == workflow ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Pages builds from a branch ($mode), not from this workflow: only docs/ is checked."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      # Pages then serves docs/ itself, so docs/ must pass as a site without the Flatpak repository.
      - uses: actions/checkout@v4
        if: steps.mode.outputs.enabled != 'true'
      - name: docs/ as Pages serves it from the branch, start page, 404 page and their links
        if: steps.mode.outputs.enabled != 'true'
        run: manager/flatpak/check-site-pages.sh --docs-only docs "/${GITHUB_REPOSITORY#*/}/"

  flatpak:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends flatpak ostree
          flatpak --version; ostree --version | sed -n 2p; gpg --version | head -1
      - name: Signing key (must be the one in manager/flatpak/signing-key.asc)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          test -n "$GPG_PRIVATE_KEY" || { echo "::error::The GPG_PRIVATE_KEY repository secret is not set: the Flatpak repository cannot be signed."; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: The latest release's bundles (else the newest release with both), checked
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=
          # The release marked latest first. The list is ordered by the date of each release's
          # tagged commit, not by when it was published, so its first entry can be a release
          # published earlier, which carries the manager bundles of that time.
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
          for t in $latest $(gh release list --exclude-pre-releases --exclude-drafts --limit 30 --json tagName --jq '.[].tagName'); do
            n=$(gh release view "$t" --json assets --jq '[.assets[].name | select(test("^foxreach-manager-.*-(x86_64|aarch64)\\.flatpak$"))] | length')
            if [[ $n == 2 ]]; then tag=$t; break; fi
          done
          test -n "$tag" || { echo "::error::No release has both manager .flatpak bundles."; exit 1; }
          echo "Bundles from $tag"
          mkdir bundles
          gh release download "$tag" --dir bundles --pattern 'foxreach-manager-*-x86_64.flatpak*' --pattern 'foxreach-manager-*-aarch64.flatpak*'
          cd bundles
          sha256sum -c ./*.flatpak.sha256
          for f in ./*.flatpak; do gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"; done
          echo "BUNDLE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Site (docs/ and the signed repository)
        run: |
          base="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          manager/flatpak/build-site.sh site "$base" bundles/*.flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  site:
    needs: [gate, flatpak]
    if: always() && needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-26.04
    outputs:
      index_sha256: ${{ steps.pages.outputs.index_sha256 }}
      notfound_sha256: ${{ steps.pages.outputs.notfound_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.flatpak.result == 'success'
        with:
          name: site
          path: site
      - name: Fallback, docs/ alone
        if: needs.flatpak.result != 'success'
        run: |
          echo "::warning::The Flatpak part failed: deploying docs/ alone. The Flatpak repository is offline until the next good run."
          manager/flatpak/build-site.sh --docs-only site
      - name: Every file in docs/ is in the site, unchanged (index.html too, in a site without the repository)
        env:
          FULL: ${{ needs.flatpak.result == 'success' }}
        run: |
          # The update lists and .xpi files are what installed add-ons poll: byte for byte. Only
          # the start page of a site with the repository differs (its Flatpak part switched on); the
          # next step checks that page.
          cd docs
          find . -type f -print0 | while IFS= read -r -d '' f; do
            if [[ $FULL == true && $f == ./index.html ]]; then continue; fi
            cmp -- "$f" "../site/$f"
          done
      - name: Start page, 404 page and their links
        id: pages
        env:
          FULL: ${{ needs.flatpak.result == 'success' }}
        run: |
          if [[ $FULL == true ]]; then mode=--full; else mode=--docs-only; fi
          manager/flatpak/check-site-pages.sh "$mode" site "/${GITHUB_REPOSITORY#*/}/"
          # The deploy job compares what Pages serves with these.
          echo "index_sha256=$(sha256sum < site/index.html | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "notfound_sha256=$(sha256sum < site/404.html | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

  deploy:
    needs: [gate, flatpak, site]
    if: always() && needs.site.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      # Before the next step, which ends the job in the docs/-only fallback.
      - name: The deployed site answers its root and a missing address with its two pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          INDEX_SHA256: ${{ needs.site.outputs.index_sha256 }}
          NOTFOUND_SHA256: ${{ needs.site.outputs.notfound_sha256 }}
        run: |
          [[ -n $PAGE_URL && -n $INDEX_SHA256 && -n $NOTFOUND_SHA256 ]] \
            || { echo "::error::No page URL from the deployment, or no page checksums from the site job."; exit 1; }
          base=${PAGE_URL%/}/
          missing="${base}no-such-page-$GITHUB_RUN_ID/a/b/c"
          # A new deployment takes a little while to be served. Each try asks with a query no one
          # asked before, so Pages' cache (which keeps an answer for up to 10 minutes) cannot
          # answer with the old site. Every 20 s, for at most 10 minutes.
          deadline=$((SECONDS + 600))
          try=0
          while :; do
            try=$((try + 1))
            q="?deploy-check=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$try"
            : > root.html; : > missing.html
            root=$(curl -sS -o root.html -w '%{http_code}' --max-time 20 "$base$q") || true
            miss=$(curl -sS -o missing.html -w '%{http_code}' --max-time 20 "$missing$q") || true
            root_ok=no; miss_ok=no
            [[ $(sha256sum < root.html | cut -d' ' -f1) == "$INDEX_SHA256" ]] && root_ok=yes
            [[ $(sha256sum < missing.html | cut -d' ' -f1) == "$NOTFOUND_SHA256" ]] && miss_ok=yes
            echo "try $try: $base answered ${root:-nothing} (the start page: $root_ok), $missing answered ${miss:-nothing} (the 404 page: $miss_ok)"
            if [[ $root == 200 && $root_ok == yes && $miss == 404 && $miss_ok == yes ]]; then
              echo "The site serves its start page at its root and its 404 page for a missing address."
              exit 0
            fi
            if (( SECONDS + 20 >= deadline )); then
              echo "::error::After 10 minutes, $base does not answer 200 with the start page and a missing address 404 with the 404 page (last: $root, $miss)."
              exit 1
            fi
            sleep 20
          done
      - name: Fail the run if the Flatpak part failed (docs/ went out alone)
        if: needs.flatpak.result != 'success'
        run: |
          echo "::error::Deployed docs/ without the Flatpak repository; see the flatpak job."
          exit 1
