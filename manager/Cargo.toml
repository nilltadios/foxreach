[package]
name = "foxreach-manager"
version = "0.5.2"
edition = "2024"
license = "MIT"
description = "Desktop app that manages foxreach: agents, updates, uninstall"
rust-version = "1.100"

[features]
# GPU rendering, with libcosmic's software fallback when no GPU works.
# `--no-default-features` builds the software renderer only.
default = ["wgpu"]
wgpu = ["libcosmic/wgpu"]

[dependencies]
resvg = { version = "0.45", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.libcosmic]
# Cargo.lock pins the commit (the one CosmicAuthenticator builds with).
git = "https://github.com/pop-os/libcosmic.git"

[profile.release]
lto = "thin"
strip = true
