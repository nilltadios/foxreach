<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Page not found: foxreach</title>
<link rel="icon" href="/foxreach/foxreach.svg" type="image/svg+xml">
<!--
  GitHub Pages serves this page for any address under the site that has no file, at any depth
  (/foxreach/a/b/c), so every link and the logo use an absolute path under /foxreach/.
  manager/flatpak/check-site-pages.sh refuses a relative one.
-->
<style>
  :root {
    --bg: #ffffff;
    --text: #1b1b1b;
    --muted: #5a5a5a;
    --line: #dcdcdc;
    --red: #c8102e;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Cantarell, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --text: #ececec; --muted: #a9a9a9; --line: #343434; --red: #ff5a5f; }
  }
  html { background: var(--bg); }
  body { margin: 0; color: var(--text); background: var(--bg); font: 1rem/1.6 var(--sans); border-top: 6px solid var(--red); }
  .page { max-width: 50rem; margin: 0 auto; padding: 36px 16px 48px; }
  a { color: var(--red); text-underline-offset: 2px; }
  a:hover { text-decoration-thickness: 2px; }
  :focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  .name { display: flex; align-items: center; gap: 14px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
  .name img { width: 40px; height: 40px; flex: none; }
  .name a { color: var(--text); font-size: 1.4rem; font-weight: 700; text-decoration: none; }
  .name a:hover { text-decoration: underline; }
  h1 { margin: 26px 0 8px; font-size: 1.6rem; line-height: 1.25; border-left: 5px solid var(--red); padding-left: 12px; }
  p { margin: 10px 0; }
  .note { color: var(--muted); }
</style>
</head>
<body>
<div class="page">
  <div class="name">
    <img src="/foxreach/foxreach.svg" width="40" height="40" alt="">
    <a href="/foxreach/">foxreach</a>
  </div>
  <main>
    <h1>Page not found</h1>
    <p>There is no page at this address on the foxreach site.</p>
    <p><a href="/foxreach/">The start page</a> shows how to install foxreach. The source and every release are on <a href="https://github.com/nilltadios/foxreach">GitHub</a>.</p>
    <p class="note">The add-on's update lists are at <a href="/foxreach/updates.json">updates.json</a> and <a href="/foxreach/updates-signed.json">updates-signed.json</a>.</p>
  </main>
</div>
</body>
</html>
